# Blueprint: connect this repo in Render Dashboard → New → Blueprint
# After the first deploy, copy the service URL into Vercel as VITE_API_URL.

services:
  - type: web
    name: orion-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: CORS_ORIGINS
        sync: false
        # Optional. Preview URLs (*.vercel.app) are already allowed.
        # Set this if you add a custom domain, e.g. https://orion.yourdomain.com
